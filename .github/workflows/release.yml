name: Build release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build portable package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        run: |
          npm run lint
          npm test
          npm run build
          Push-Location src-tauri
          cargo fmt --all --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          Pop-Location

      - name: Confirm tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build executable
        run: npm run tauri:build

      - name: Build portable ZIP and SHA-256
        shell: pwsh
        run: |
          & ./scripts/package-portable.ps1 -SkipBuild
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "release/koyomado-v$version-windows-portable.zip"
          $manual = "docs/Koyomado操作説明書.pdf"
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $manualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $manual).Hash.ToLowerInvariant()
          @(
            "$archiveHash  $(Split-Path -Leaf $archive)"
            "$manualHash  $(Split-Path -Leaf $manual)"
          ) | Set-Content -Encoding utf8NoBOM -LiteralPath "release/SHA256SUMS.txt"

      - name: Upload unsigned release artifact
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koyomado-unsigned-${{ github.ref_name }}
          path: |
            src-tauri/target/release/koyomado.exe
            release/koyomado-v*-windows-portable.zip
            release/SHA256SUMS.txt
            docs/Koyomado操作説明書.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Create or update draft GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "release/koyomado-v$version-windows-portable.zip"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Koyomado $version" --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME $archive "docs/Koyomado操作説明書.pdf" "release/SHA256SUMS.txt" --clobber

# SignPath Foundationで採択後、upload-unsignedのartifact-idを
# signpath/github-action-submit-signing-requestへ渡す署名ステップを追加します。
# 採択前のArtifactとdraft Releaseは必ず「未署名」として扱います。
