[package]
name = "koyomado"
version = "0.1.7"
description = "持ち運べるWindows用カレンダー"
authors = ["Y-TEC"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "koyomado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
