changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新機能
      labels:
        - feature
        - enhancement
    - title: 修正
      labels:
        - bug
    - title: ドキュメント
      labels:
        - documentation
    - title: 依存関係・保守
      labels:
        - dependencies
        - maintenance
    - title: その他の変更
      labels:
        - "*"
