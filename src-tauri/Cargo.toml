[package]
name = "koyomado"
version = "1.0.0"
description = "持ち運べるWindows用カレンダー"
authors = ["Y-TEC"]
license = "Apache-2.0"
repository = "https://github.com/ytec-forge-commits/ytec-calendar"
homepage = "https://ytec.cloudfree.jp/forge/projects/koyomado/"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "koyomado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
auto-launch = "0.5.0"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = ["tray-icon"] }
url = "2.5.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["ApplicationModel", "Storage", "Storage_Search"] }
