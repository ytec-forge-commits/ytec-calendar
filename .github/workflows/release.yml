name: Build release signing inputs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows signing inputs
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        run: |
          npm run lint
          npm test
          npm run build
          npm run test:windows-signing-policy
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-partner-center-submission.ps1 -SkipArtifactHashCheck
          Push-Location src-tauri
          cargo fmt --all --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          Pop-Location

      - name: Confirm tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build executable
        run: npm run tauri:build

      - name: Build Store submission package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Store submission builds require a stable x.y.z package version."
          }
          & ./scripts/package-msix.ps1 -SkipBuild -PackageVersion "$version.0" -CreateUpload

      - name: Upload unsigned signing inputs and Store package
        id: upload-signing-inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koyomado-signing-inputs-${{ github.ref_name }}
          path: |
            src-tauri/target/release/koyomado.exe
            release/koyomado-v*-store-x64.msix
            release/koyomado-v*-store-x64.msixupload
            docs/Koyomado操作説明書.pdf
          if-no-files-found: error
          retention-days: 14

# Store提出用MSIXはPartner Center側で署名します。
# 直接配布用ZIPは、管理されたWindows端末で自己署名と検証を行った後にだけ
# GitHub Releaseと公式サイトへ公開します。このworkflowは公開操作を行いません。
